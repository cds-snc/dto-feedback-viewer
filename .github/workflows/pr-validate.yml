# Validates that a pull request builds, passes its tests and produces an image.
# Nothing is pushed or deployed; tf_plan_staging.yml covers the Terraform side.
name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build image
        run: docker build -f ./docker/Dockerfile . -t feedback-viewer:${{ github.sha }}
